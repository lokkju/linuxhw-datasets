[project]
name = "edid-dataset"
version = "0.1.0"
description = "EDID dataset builder and client library"
readme = "CLAUDE.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{ name = "lokkju" }]
keywords = ["edid", "display", "monitor", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "duckdb>=1.0",
    "pyroaring>=1.0",
    "click>=8.0",
    "tqdm>=4.0",
    "polars>=1.36.1",
    "pyarrow>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
edid-build = "edid_build.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edid_build", "src/edid_dataset"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
